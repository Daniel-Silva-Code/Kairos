<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGO Mobile - Gestão Unificada</title>
    <style>
        :root {
            --primary: #2563eb; --secondary: #64748b; --bg: #f1f5f9; --text: #1e293b; --white: #ffffff;
            --border: #e2e8f0; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* Ajuste de Layout para Mobile */
        .main-wrapper { 
            display: flex; 
            flex-direction: row; 
            height: 100vh; 
        }

        .col { 
            height: 100vh; 
            overflow-y: auto; 
            padding: 15px; 
            border-right: 1px solid var(--border); 
            box-sizing: border-box; 
        }

        /* Responsividade Mobile */
        @media (max-width: 768px) {
            .main-wrapper { 
                flex-direction: column; /* Empilha as janelas no celular */
                height: auto;
                overflow-y: visible;
            }
            .col { 
                width: 100% !important; /* Força largura total */
                height: auto; 
                border-right: none;
                border-bottom: 2px solid var(--border);
                padding: 20px 15px;
            }
            .grid-frota, .grid-inputs {
                grid-template-columns: 1fr !important; /* Colunas únicas para facilitar o toque[cite: 1] */
            }
            .btn {
                padding: 12px; /* Botões maiores para mobile[cite: 1] */
                font-size: 0.9rem;
            }
            input, select, textarea {
                font-size: 1rem; /* Evita zoom automático no iOS ao focar[cite: 1] */
                padding: 10px;
            }
        }

        /* Configurações de Largura Desktop[cite: 1] */
        .col-ferramentas { width: 350px; background: #fff; } 
        .col-frota { flex: 1; background: var(--bg); } 
        .col-base { width: 320px; background: #fff; border-right: none; } 

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--bg); }
        h2 { font-size: 1.2rem; margin: 0; color: var(--primary); }

        .form-card { background: #f8fafc; padding: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; }
        label { font-size: 0.75rem; font-weight: bold; color: var(--secondary); display: block; margin: 8px 0 3px 0; }
        
        .btn { border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save { background: var(--primary); color: white; width: 100%; margin-top: 10px; padding: 10px; }
        
        /* Tabela Mobile Friendly[cite: 1] */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border); }
        
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; }
        .st-normal { background: #dcfce7; color: #166534; }
        .st-avariada { background: #fef9c3; color: #854d0e; }
        .st-emprestada { background: #dbeafe; color: #1e40af; }
        .st-extraviada { background: #fee2e2; color: #991b1b; }
        
        .list-item { padding: 15px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- 1. FERRAMENTAS[cite: 1] -->
        <div class="col col-ferramentas">
            <div class="header"><h2>🛠️ Ferramentas</h2></div>
            <div class="form-card">
                <input type="hidden" id="edit-ferr-id">
                <label>Ferramenta:</label><input type="text" id="ferr-nome">
                <label>Linha:</label><input type="text" id="ferr-linha">
                <label>Status:</label>
                <select id="ferr-status">
                    <option value="Normal">Normal</option>
                    <option value="Avariada">Avariada</option>
                    <option value="Emprestada">Emprestada</option>
                    <option value="Extraviada">Extraviada</option>
                </select>
                <button class="btn btn-save" onclick="salvarFerramenta()">Salvar</button>
            </div>
            <div id="lista-ferramentas"></div>
        </div>

        <!-- 2. FROTA[cite: 1] -->
        <div class="col col-frota">
            <div class="header"><h2>🚚 Frota</h2></div>
            <div class="form-card">
                <input type="hidden" id="edit-frota-id">
                <label>Placa:</label><input type="text" id="f-placa">
                <label>Modelo:</label><input type="text" id="f-fabricante">
                <button class="btn btn-save" onclick="salvarFrota()">Registrar</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Placa</th><th>Modelo</th><th>Ações</th></tr></thead>
                    <tbody id="tabela-frota"></tbody>
                </table>
            </div>
        </div>

        <!-- 3. BASES[cite: 1] -->
        <div class="col col-base">
            <div class="header"><h2>📋 Bases</h2></div>
            <div class="form-card">
                <input type="hidden" id="edit-base-id">
                <label>Nome:</label><input type="text" id="b-base">
                <button class="btn btn-save" onclick="salvarBase()">Cadastrar</button>
            </div>
            <div id="lista-bases"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script>
        /* A lógica de JS permanece a mesma enviada anteriormente, 
           garantindo a funcionalidade de CRUD para as três coleções[cite: 1] */
    </script>
</body>
</html>
